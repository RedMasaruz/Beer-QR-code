<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แอดมิน</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bar">
  <h1>แอดมิน</h1>
  <a href="/pos">POS</a>
  <a href="/kitchen">รับออเดอร์</a>
</div>
<div class="tabs" id="tabs"></div>

<div class="panel" id="p-summary"></div>
<div class="panel hidden" id="p-acct"></div>
<div class="panel hidden" id="p-menu"></div>
<div class="panel hidden" id="p-settings"></div>
<div class="panel hidden" id="p-qr"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => '฿' + Number(n).toLocaleString('th-TH', { maximumFractionDigits: 2 });

let cfg = null;
let tab = 'summary';

async function api(url, method = 'GET', body) {
  const r = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { location.href = '/login?next=/admin'; throw new Error('unauthorized'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
  return j;
}
const guard = (fn) => async (...a) => { try { await fn(...a); } catch (e) { if (e.message !== 'unauthorized') alert(e.message); } };

const TABS = [['summary', 'สรุปวันนี้'], ['acct', 'บัญชี'], ['menu', 'เมนู'], ['settings', 'ตั้งค่า'], ['qr', 'QR สั่งซื้อ']];
function renderTabs() {
  $('tabs').innerHTML = TABS.map(([k, l]) => `<button class="chip ${tab === k ? 'on' : ''}" data-t="${k}">${l}</button>`).join('');
  $('tabs').querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => show(b.dataset.t)));
}
async function show(t) {
  tab = t;
  renderTabs();
  for (const [k] of TABS) $('p-' + k).classList.toggle('hidden', k !== t);
  await loadCfg();
  ({ summary: renderSummary, acct: renderAcct, menu: renderMenu, settings: renderSettings, qr: renderQr })[t]();
}
async function loadCfg() { cfg = await api('/api/staff/config'); }

function warnings() {
  const w = [];
  if (cfg.defaultStaffPin) w.push('ยังใช้ PIN พนักงานเริ่มต้น 1234 — ตั้ง STAFF_PIN ใหม่ก่อนใช้งานจริง');
  if (cfg.defaultAdminPin) w.push('ยังใช้ PIN แอดมินเริ่มต้น 5678 — ตั้ง ADMIN_PIN ใหม่ก่อนใช้งานจริง');
  if (/localhost|127\.0\.0\.1/.test(cfg.baseUrl)) w.push('ตอนนี้เปิดผ่าน localhost — QR ที่โต๊ะจะใช้ไม่ได้จนกว่าจะเปิดผ่านที่อยู่จริงของเซิร์ฟเวอร์ (ดู README)');
  return w.map((x) => `<div class="warnbox">⚠️ ${esc(x)}</div>`).join('');
}

/* ---------- สรุปวันนี้ ---------- */
async function renderSummary() {
  const r = await api('/api/staff/report');
  const openSum = r.openUnpaid.reduce((a, o) => a + o.total, 0);
  $('p-summary').innerHTML = `${warnings()}
    <h2>สรุปวันนี้ (${esc(r.date)})</h2>
    <div class="stat">
      <div class="card">รับเงินแล้ว<b style="color:var(--ok)">${fmt(r.totals.receipts)}</b></div>
      <div class="card">คืนเงิน<b>${fmt(r.totals.refunds)}</b></div>
      <div class="card">ยอดสุทธิ<b>${fmt(r.totals.net)}</b></div>
      <div class="card">ค้างจ่าย<b style="color:var(--bad)">${fmt(openSum)}</b><span class="muted">${r.openUnpaid.length} ออเดอร์</span></div>
      <div class="card">ยกเลิก (ไม่ได้จ่าย)<b>${r.cancelled.count}</b></div>
    </div>
    <p class="muted">ยอดนับตามวัน-เวลาที่ <b>รับเงิน</b> ไม่ใช่เวลาที่สั่ง ตอนปิดร้านให้ไปแท็บ "บัญชี" เพื่อเทียบกับเงินเข้าบัญชีและเงินสดในลิ้นชัก</p>`;
}

/* ---------- บัญชี: ปิดร้านรายวัน / รายงานช่วงเวลา / ส่งออก CSV ---------- */
const bkkToday = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const r2 = (n) => Math.round(n * 100) / 100;
let acctDate = null, rng = null;

function renderAcct() {
  acctDate = acctDate || bkkToday();
  if (!rng) { const t = bkkToday(); rng = { from: t.slice(0, 8) + '01', to: t }; }
  $('p-acct').innerHTML = `
    <h2>ปิดร้านรายวัน</h2>
    <div class="inline"><input type="date" id="a-date" value="${acctDate}"><button class="btn ghost small" id="a-today">วันนี้</button></div>
    <div id="a-day" style="margin-top:10px"></div>
    <h2>รายงานตามช่วงเวลา</h2>
    <div class="inline" style="margin-bottom:8px">
      <button class="btn ghost small" data-p="today">วันนี้</button><button class="btn ghost small" data-p="yday">เมื่อวาน</button>
      <button class="btn ghost small" data-p="7">7 วัน</button><button class="btn ghost small" data-p="month">เดือนนี้</button><button class="btn ghost small" data-p="lastmonth">เดือนก่อน</button>
    </div>
    <div class="inline"><input type="date" id="r-from" value="${rng.from}"> ถึง <input type="date" id="r-to" value="${rng.to}"></div>
    <div id="a-range" style="margin-top:10px"></div>
    <h2>ส่งออกไฟล์ CSV (ให้ผู้ทำบัญชี)</h2>
    <p class="muted" style="margin:0 0 8px">ใช้ช่วงวันที่ด้านบน นับตามวันที่รับเงิน (ออเดอร์ที่ยังไม่จ่ายใช้วันที่สั่ง) เปิดใน Excel ภาษาไทยได้ ทุกการส่งออกถูกบันทึกไว้</p>
    <div class="inline" id="a-export"></div>`;
  const P = $('p-acct');
  $('a-date').onchange = () => { if ($('a-date').value) { acctDate = $('a-date').value; loadDay(); } };
  $('a-today').onclick = () => { acctDate = bkkToday(); $('a-date').value = acctDate; loadDay(); };
  const setRng = (from, to) => { rng = { from, to }; $('r-from').value = from; $('r-to').value = to; loadRange(); };
  $('r-from').onchange = () => { if ($('r-from').value) setRng($('r-from').value, rng.to); };
  $('r-to').onchange = () => { if ($('r-to').value) setRng(rng.from, $('r-to').value); };
  P.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => {
    const t = bkkToday(), p = b.dataset.p;
    if (p === 'today') setRng(t, t);
    else if (p === 'yday') setRng(addDays(t, -1), addDays(t, -1));
    else if (p === '7') setRng(addDays(t, -6), t);
    else if (p === 'month') setRng(t.slice(0, 8) + '01', t);
    else { const first = t.slice(0, 8) + '01'; setRng(addDays(first, -1).slice(0, 8) + '01', addDays(first, -1)); }
  }));
  loadDay(); loadRange();
}

const loadDay = guard(async () => {
  const r = await api('/api/staff/report?date=' + encodeURIComponent(acctDate));
  const m = Object.fromEntries(r.methods.map((x) => [x.method, x]));
  const rows = r.methods.map((x) => `<tr><td>${esc(x.label)}</td><td>${x.receiptCount} รายการ · ${fmt(x.receipts)}</td><td>${x.refundCount ? x.refundCount + ' รายการ · ' + fmt(x.refunds) : '-'}</td><td><b>${fmt(x.net)}</b></td></tr>`).join('');
  const open = r.openUnpaid.length
    ? `<div class="warnbox"><b>ออเดอร์ที่ยังไม่ได้รับเงินของวันนี้ (${r.openUnpaid.length} รายการ รวม ${fmt(r2(r.openUnpaid.reduce((a, o) => a + o.total, 0)))})</b> — เงินส่วนนี้อาจตกหล่น ตรวจในหน้ารับออเดอร์แท็บ "รอรับเงิน" ก่อนปิดร้าน<br>${r.openUnpaid.map((o) => `${['pickup', 'pos'].includes(o.orderType) ? `คิว ${esc(o.queueNo || '-')} (${esc(o.customerName || '-')})` : `โต๊ะ ${o.table}`} (#${o.seq}) ${fmt(o.total)}`).join(' · ')}</div>` : '';
  const c = r.close;
  $('a-day').innerHTML = `
    <table class="acct-table"><thead><tr><th>วิธีจ่าย</th><th>รับเงิน</th><th>คืนเงิน</th><th>สุทธิ</th></tr></thead><tbody>${rows}
      <tr class="tot"><td>รวม</td><td>${fmt(r.totals.receipts)}</td><td>${fmt(r.totals.refunds)}</td><td><b>${fmt(r.totals.net)}</b></td></tr></tbody></table>
    <p class="muted" style="margin:6px 0">ออเดอร์ที่ยกเลิกโดยไม่ได้จ่าย: ${r.cancelled.count} รายการ (${fmt(r.cancelled.total)}) ไม่นับเป็นรายรับ</p>
    ${open}
    <div class="card form" style="margin-top:10px">
      <b>เทียบกับของจริง</b>
      <label>ยอดเงินเข้าบัญชีร้านของวันนี้ตามแอปธนาคาร (บาท) <span class="muted">ระบบคาดว่า ${fmt(m.promptpay.net)} (PromptPay สุทธิ)</span>
        <input type="number" id="c-bank" min="0" step="0.01" value="${c ? c.bankTotal : ''}"></label><div id="c-bank-d"></div>
      <label>เงินสดที่นับได้ในลิ้นชัก (บาท) <span class="muted">ระบบคาดว่า ${fmt(m.cash.net)} (เงินสดสุทธิ ไม่รวมเงินทอนตั้งต้น)</span>
        <input type="number" id="c-cash" min="0" step="0.01" value="${c ? c.countedCash : ''}"></label><div id="c-cash-d"></div>
      ${m.other.receiptCount || m.other.refundCount ? `<div class="muted">วิธี "อื่น ๆ" สุทธิ ${fmt(m.other.net)} ไม่ได้นำมาเทียบอัตโนมัติ ตรวจเองตามช่องทางที่ใช้</div>` : ''}
      <label>หมายเหตุ (เช่น สาเหตุที่ยอดต่าง)<input type="text" id="c-note" maxlength="200" value="${esc(c ? c.note : '')}"></label>
      <button class="btn" id="c-save">${c ? 'บันทึกแก้ไขผลปิดร้าน' : 'บันทึกปิดร้าน'}</button>
      <div class="muted">${c ? 'บันทึกล่าสุด ' + new Date(c.closedAt).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }) + (c.edits ? ` · แก้ไขแล้ว ${c.edits} ครั้ง (เก็บประวัติเดิมไว้ทุกครั้ง)` : '') : 'ยังไม่ได้ปิดร้านของวันนี้'}</div>
    </div>`;
  const diff = (inputId, outId, expected) => {
    const v = $(inputId).value, out = $(outId);
    if (v === '') { out.innerHTML = ''; return; }
    const d = r2(Number(v) - expected);
    out.innerHTML = d === 0 ? '<span class="badge ok">ตรงกัน</span>'
      : `<span class="badge bad">ต่างกัน ${fmt(Math.abs(d))} (${d > 0 ? 'เกินกว่าที่ระบบคาด' : 'ขาดจากที่ระบบคาด'})</span>`;
  };
  const upd = () => { diff('c-bank', 'c-bank-d', r2(m.promptpay.net)); diff('c-cash', 'c-cash-d', r2(m.cash.net)); };
  $('c-bank').oninput = upd; $('c-cash').oninput = upd; upd();
  $('c-save').onclick = guard(async () => {
    if ($('c-bank').value === '' || $('c-cash').value === '') { alert('กรอกยอดเงินเข้าบัญชีและเงินสดให้ครบทั้งสองช่อง (ไม่มีให้ใส่ 0)'); return; }
    await api('/api/staff/close', 'POST', { date: acctDate, bankTotal: $('c-bank').value, countedCash: $('c-cash').value, note: $('c-note').value });
    await loadDay();
  });
});

const loadRange = guard(async () => {
  const q = `from=${encodeURIComponent(rng.from)}&to=${encodeURIComponent(rng.to)}`;
  $('a-export').innerHTML = [['orders', 'ออเดอร์'], ['order_items', 'รายการอาหาร'], ['refunds', 'การคืนเงิน']]
    .map(([k, l]) => `<a class="btn ghost small" href="/api/staff/export/${k}?${q}" download>ดาวน์โหลด ${l}</a>`).join('');
  const r = await api('/api/staff/report/range?' + q);
  const rows = r.rows.map((x) => `<tr><td>${esc(x.date)}</td><td>${x.orders}</td><td>${fmt(x.receipts)}</td><td>${fmt(x.refunds)}</td><td><b>${fmt(x.net)}</b></td></tr>`).join('');
  const top = r.topItems.map((i) => `<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${fmt(i.total)}</td></tr>`).join('');
  $('a-range').innerHTML = r.rows.length ? `
    <table class="acct-table"><thead><tr><th>วันที่</th><th>ออเดอร์</th><th>รับเงิน</th><th>คืนเงิน</th><th>สุทธิ</th></tr></thead><tbody>${rows}
      <tr class="tot"><td>รวม</td><td>${r.totals.orders}</td><td>${fmt(r.totals.receipts)}</td><td>${fmt(r.totals.refunds)}</td><td><b>${fmt(r.totals.net)}</b></td></tr></tbody></table>
    <h3 style="margin:14px 0 6px;font-size:16px">เมนูขายดี</h3>
    <table class="acct-table"><thead><tr><th>เมนู</th><th>จำนวนที่ขาย</th><th>ยอดรวม</th></tr></thead><tbody>${top || '<tr><td colspan=3 class="muted">-</td></tr>'}</tbody></table>`
    : '<p class="muted">ไม่มีการรับเงินในช่วงนี้</p>';
});

/* ---------- ย่อรูปก่อนอัปโหลด: ด้านยาวสุด 900px, JPEG, ไม่เกิน ~500KB ---------- */
async function shrinkToJpeg(file) {
  if (!/^image\//.test(file.type)) throw new Error('กรุณาเลือกไฟล์รูปภาพ');
  let bmp;
  try { bmp = await createImageBitmap(file); } // หมุนรูปตาม EXIF ให้เอง
  catch { throw new Error('เปิดรูปนี้ไม่ได้ (ลองถ่ายใหม่หรือบันทึกเป็น JPG)'); }
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); // PNG โปร่งใสจะได้ไม่เป็นพื้นดำ
  g.drawImage(bmp, 0, 0, c.width, c.height);
  for (const q of [0.85, 0.75, 0.65, 0.5]) {
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', q));
    if (blob && blob.size <= 500 * 1024) return blob;
  }
  throw new Error('ย่อรูปไม่สำเร็จ ลองรูปอื่น');
}

/* ---------- เมนู ---------- */
function renderMenu() {
  const catOpts = (sel) => cfg.categories.map((c) => `<option value="${esc(c.id)}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const html = cfg.categories.map((c) => {
    const items = cfg.items.filter((i) => i.categoryId === c.id).map((i) => `
      <div class="inline ${i.visible === false ? 'item-hidden' : ''}" style="padding:8px 0;border-bottom:1px solid var(--line)" data-item="${esc(i.id)}">
        <div class="imgbox">
          ${i.image ? `<img class="thumb" src="/img/${esc(i.image)}" alt="">` : i.defaultImage ? `<img class="thumb" src="${esc(i.defaultImage)}" alt="">` : '<div class="noimg">ไม่มีรูป</div>'}
          <label class="btn ghost small" style="margin:0">${i.image || i.defaultImage ? 'เปลี่ยนรูป' : 'เพิ่มรูป'}<input type="file" accept="image/*" data-img="${esc(i.id)}"></label>
          ${i.image ? `<button class="btn ghost small" data-delimg="${esc(i.id)}">ลบรูป</button>` : ''}
        </div>
        <input type="text" class="f-name" value="${esc(i.name)}" style="flex:1;min-width:140px" maxlength="60">
        <input type="number" class="f-price" value="${i.price}" min="0" step="0.5" style="width:90px">
        <input type="number" class="f-stock" value="${i.stockCount ?? ''}" min="0" step="1" style="width:95px" placeholder="สต็อก ∞" title="จำนวนสต็อก (เว้นว่าง = ไม่จำกัด)">
        <label class="inline"><input type="checkbox" class="f-vis" ${i.visible !== false ? 'checked' : ''}> แสดง</label>
        <label class="inline"><input type="checkbox" class="f-av" ${i.available ? 'checked' : ''}> มีของ</label>
        <button class="btn small" data-save="${esc(i.id)}">บันทึก</button>
        <button class="btn ghost small" data-del="${esc(i.id)}">ลบ</button>
      </div>`).join('');
    return `<div class="card ${c.visible === false ? 'category-hidden' : ''}" style="margin-top:12px">
      <div class="inline" style="justify-content:space-between">
        <b style="font-size:18px">${esc(c.name)} ${c.visible === false ? '<span class="badge gray">ซ่อนอยู่</span>' : ''}</b>
        <span><button class="btn ghost small" data-ren="${esc(c.id)}">เปลี่ยนชื่อหมวด</button>
        <button class="btn ghost small" data-delcat="${esc(c.id)}">ลบหมวด</button></span>
      </div>
      <label class="inline category-visibility"><input type="checkbox" data-catvis="${esc(c.id)}" ${c.visible !== false ? 'checked' : ''}> แสดงหมวดนี้ให้ลูกค้าเห็น</label>
      ${items || '<p class="muted">ยังไม่มีเมนู</p>'}
      <div class="inline" style="margin-top:10px" data-new="${esc(c.id)}">
        <input type="text" class="n-name" placeholder="ชื่อเมนูใหม่" style="flex:1;min-width:140px" maxlength="60">
        <input type="number" class="n-price" placeholder="ราคา" min="0" step="0.5" style="width:90px">
        <button class="btn small" data-add="${esc(c.id)}">+ เพิ่มเมนู</button>
      </div>
    </div>`;
  }).join('');

  $('p-menu').innerHTML = `<h2>เมนูและราคา</h2>
    <p class="muted">ช่อง “สต็อก ∞” ใส่จำนวนสินค้าที่มี ระบบจะหักอัตโนมัติเมื่อสั่ง และคืนเมื่อยกเลิกออเดอร์ เว้นว่างไว้หากไม่ต้องการนับสต็อก<br>ซ่อนหมวดได้โดยเอาติ๊ก "แสดงหมวดนี้ให้ลูกค้าเห็น" ออก หรือซ่อนเฉพาะเมนูโดยเอาติ๊ก "แสดง" ออก ข้อมูลจะยังอยู่และเปิดกลับได้ตลอด<br>ติ๊ก "มีของ" ออกเพื่อหยุดขายชั่วคราว<br>รูปอาหาร: เพิ่มเมนูก่อน แล้วกด "เพิ่มรูป" ที่แถวเมนู</p>
    ${html}
    <div class="inline" style="margin-top:16px">
      <input type="text" id="newCat" placeholder="ชื่อหมวดใหม่" maxlength="40">
      <button class="btn small" id="addCat">+ เพิ่มหมวด</button>
    </div>`;

  const P = $('p-menu');
  P.querySelectorAll('[data-save]').forEach((b) => (b.onclick = guard(async () => {
    const row = b.closest('[data-item]');
    await api('/api/staff/items/' + b.dataset.save, 'PUT', {
      name: row.querySelector('.f-name').value, price: row.querySelector('.f-price').value,
      stockCount: row.querySelector('.f-stock').value,
      visible: row.querySelector('.f-vis').checked, available: row.querySelector('.f-av').checked,
    });
    b.textContent = 'บันทึกแล้ว ✓'; setTimeout(() => (b.textContent = 'บันทึก'), 1200);
  })));
  P.querySelectorAll('[data-catvis]').forEach((inp) => (inp.onchange = guard(async () => {
    await api('/api/staff/categories/' + inp.dataset.catvis, 'PUT', { visible: inp.checked });
    await show('menu');
  })));
  P.querySelectorAll('[data-del]').forEach((b) => (b.onclick = guard(async () => {
    if (!confirm('ลบเมนูนี้?')) return;
    await api('/api/staff/items/' + b.dataset.del, 'DELETE'); await show('menu');
  })));
  P.querySelectorAll('[data-add]').forEach((b) => (b.onclick = guard(async () => {
    const box = b.closest('[data-new]');
    await api('/api/staff/items', 'POST', { name: box.querySelector('.n-name').value, price: box.querySelector('.n-price').value, categoryId: b.dataset.add, available: true });
    await show('menu');
  })));
  P.querySelectorAll('[data-ren]').forEach((b) => (b.onclick = guard(async () => {
    const cur = cfg.categories.find((c) => c.id === b.dataset.ren);
    const name = prompt('ชื่อหมวดใหม่', cur.name);
    if (name) { await api('/api/staff/categories/' + b.dataset.ren, 'PUT', { name }); await show('menu'); }
  })));
  P.querySelectorAll('[data-delcat]').forEach((b) => (b.onclick = guard(async () => {
    if (!confirm('ลบหมวดนี้?')) return;
    await api('/api/staff/categories/' + b.dataset.delcat, 'DELETE'); await show('menu');
  })));
  P.querySelectorAll('[data-img]').forEach((inp) => (inp.onchange = guard(async () => {
    const f = inp.files[0];
    if (!f) return;
    const label = inp.closest('label');
    label.firstChild.textContent = 'กำลังอัปโหลด…';
    try {
      const blob = await shrinkToJpeg(f);
      const r = await fetch('/api/staff/items/' + inp.dataset.img + '/image', { method: 'PUT', headers: { 'Content-Type': 'image/jpeg' }, body: blob });
      if (r.status === 401) { location.href = '/login?next=/admin'; return; }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'อัปโหลดไม่สำเร็จ');
      await show('menu');
    } finally { label.firstChild.textContent = 'เพิ่มรูป'; inp.value = ''; }
  })));
  P.querySelectorAll('[data-delimg]').forEach((b) => (b.onclick = guard(async () => {
    if (!confirm('ลบรูปนี้?')) return;
    await api('/api/staff/items/' + b.dataset.delimg + '/image', 'DELETE'); await show('menu');
  })));
  $('addCat').onclick = guard(async () => {
    await api('/api/staff/categories', 'POST', { name: $('newCat').value }); await show('menu');
  });
}

/* ---------- ตั้งค่า ---------- */
function renderSettings() {
  const s = cfg.settings;
  $('p-settings').innerHTML = `${warnings()}
    <h2>ตั้งค่าร้าน</h2>
    <div class="card form">
      <label>ชื่อร้าน<input type="text" id="s-name" value="${esc(s.shopName)}" maxlength="50"></label>
      <label>จำนวนโต๊ะ<input type="number" id="s-tables" value="${s.tableCount}" min="1" max="200"></label>
      <label class="inline"><input type="checkbox" id="s-pickup" ${s.pickupEnabled !== false ? 'checked' : ''}>
        เปิดรับออเดอร์ “สั่งรับเองที่เคาน์เตอร์”</label>
      <div class="muted">การชำระเงิน: พนักงานแจ้งยอด และให้ลูกค้าสแกน QR บัญชีร้านแล้วพิมพ์ยอดเอง ก่อนกดรับเงินให้ตรวจเงินเข้าบัญชีจริงเสมอ</div>
      <label class="inline"><input type="checkbox" id="s-req" ${s.requirePaymentBeforeKitchen ? 'checked' : ''}>
        ให้เริ่มทำอาหารได้ก็ต่อเมื่อรับเงินแล้วเท่านั้น (กันลูกค้าไม่จ่าย แต่ต้องรอพนักงานกด "รับเงินแล้ว" ทุกออเดอร์)</label>
      <button class="btn" id="s-save">บันทึกการตั้งค่า</button>
    </div>`;
  $('s-save').onclick = guard(async () => {
    await api('/api/staff/settings', 'PUT', {
      shopName: $('s-name').value, tableCount: $('s-tables').value,
      pickupEnabled: $('s-pickup').checked,
      requirePaymentBeforeKitchen: $('s-req').checked,
    });
    await show('settings');
    alert('บันทึกแล้ว');
  });
}

/* ---------- QR สั่งซื้อ ---------- */
function renderQr() {
  const n = cfg.settings.tableCount;
  let figs = '';
  for (let i = 1; i <= n; i++) figs += `<figure><img src="/api/staff/tableqr/${i}" alt="QR โต๊ะ ${i}"><figcaption>โต๊ะ ${i}</figcaption><div class="muted">สแกนเพื่อสั่งอาหาร</div></figure>`;
  $('p-qr').innerHTML = `${warnings()}
    <div class="inline noprint" style="justify-content:space-between">
      <h2>QR สำหรับลูกค้า</h2>
      <button class="btn small" onclick="window.print()">พิมพ์</button>
    </div>
    <p class="muted noprint">QR ชี้ไปที่ <b>${esc(cfg.baseUrl)}</b> — ใช้ใบ “สั่งรับเอง” ที่เคาน์เตอร์ และใช้ QR โต๊ะสำหรับลูกค้าที่นั่งในร้าน</p>
    <div class="qrgrid pickup-qr"><figure><img src="/api/staff/pickupqr" alt="QR สั่งรับเอง"><figcaption>สั่งรับเองที่เคาน์เตอร์</figcaption><div class="muted">สแกนเพื่อสั่งเมนู</div></figure></div>
    <h2>QR สำหรับติดโต๊ะ (${n} โต๊ะ)</h2>
    <div class="qrgrid">${figs}</div>`;
}

show('summary').catch(() => {});
</script>
</body>
</html>
