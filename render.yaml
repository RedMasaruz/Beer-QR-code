services:
  - type: web
    name: beer-qr-code
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/menu
    autoDeployTrigger: commit
    envVars:
      - key: DATA_FILE
        value: /tmp/beer-qr-data.json
      - key: IMG_DIR
        value: /tmp/beer-qr-images
      - key: STAFF_PIN
        sync: false
      - key: ADMIN_PIN
        sync: false

